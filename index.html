/* Layout: mostrador de pedidos — catálogo a la izquierda, hoja de cotización fija a la derecha (abajo en móvil) */
:root{

  --ink:#1D2B1F; --soft:#56645A; --forest:#2F5E34; --on-forest:#F4F6EE;
  --teal:#2D919E; --teal-ink:#1F6E78; --lilac:#715692; --warn:#9A5B12; --warn-bg:#F7E8CF;
  --display:"DM Serif Display",Georgia,serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A14; --paper:#18231B; --sunk:#1F2D22; --line:#2F4234;
  --ink:#E8EEE2; --soft:#A8B6AA; --forest:#7FB487; --on-forest:#0E1510;
  --teal:#6CC3CE; --teal-ink:#7FD0DA; --lilac:#B9A0D8; --warn:#E3AE62; --warn-bg:#33281A; color-scheme:dark}}
:root[data-theme="dark"]{

  --ink:#E8EEE2; --soft:#A8B6AA; --forest:#7FB487; --on-forest:#0E1510;
  --teal:#6CC3CE; --teal-ink:#7FD0DA; --lilac:#B9A0D8; --warn:#E3AE62; --warn-bg:#33281A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 120px}
header.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:2px solid var(--forest);margin-bottom:18px}
header.top h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1;margin:0;color:var(--forest);text-wrap:balance}
header.top p{margin:6px 0 0;color:var(--soft);max-width:60ch}
.brandrow{display:flex;gap:18px;align-items:center;min-width:0}
.brandrow>div{min-width:0}
.logo{flex:none;width:96px;height:96px;border-radius:50%;background:var(--paper)}
@media (max-width:520px){.brandrow{flex-direction:column;align-items:flex-start}.logo{width:72px;height:72px}}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.steps{display:flex;gap:6px;font-size:13px;font-weight:700;color:var(--soft)}
.steps span{padding:4px 10px;border-radius:999px;background:var(--sunk)}
.steps span.on{background:var(--forest);color:var(--on-forest)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.tools{display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:3}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:11px 16px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px}
.chips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--soft);white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-forest)}
.cat{margin-top:18px}
.cat h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px;color:var(--forest);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat h2 small{font-family:var(--body);font-size:12px;color:var(--soft);font-weight:700}
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.sel{background:color-mix(in srgb,var(--teal) 9%,var(--paper))}
.row .n{font-weight:700;min-width:0;overflow-wrap:anywhere}
.row .p{font-size:12.5px;color:var(--soft)}
.price{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.price small{display:block;font-weight:600;color:var(--soft);font-size:11.5px}
.ask{font-size:12px;font-weight:800;color:var(--lilac);text-transform:uppercase;letter-spacing:.06em}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.qty button{border:0;background:transparent;width:34px;height:34px;font-size:18px;font-weight:700;color:var(--forest)}
.qty input{width:34px;border:0;text-align:center;background:transparent;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.add{border:1px solid var(--forest);background:transparent;color:var(--forest);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;height:36px}
.empty{padding:28px;text-align:center;color:var(--soft)}
aside.sheet{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);display:grid;max-height:calc(100vh - 24px);grid-template-rows:auto minmax(0,1fr) auto}
.sheet header{padding:14px 16px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline}
.sheet header h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.lines{overflow:auto;padding:6px 16px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px dotted var(--line);font-size:13.5px}
.line b{font-weight:700;overflow-wrap:anywhere}
.line span{color:var(--soft);font-size:12px}
.line .t{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.line button{grid-column:2;justify-self:end;border:0;background:transparent;color:var(--soft);font-size:12px;text-decoration:underline;padding:0}
.tot{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:4px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:8px}
.tot .big{font-size:20px;font-weight:800;color:var(--forest)}
.tot .eur{color:var(--soft);font-size:13px}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;background:var(--forest);color:var(--on-forest);width:100%}
.btn.alt{background:transparent;color:var(--forest);border:1.5px solid var(--forest)}
.btn:disabled{opacity:.45;cursor:default}
.note{font-size:12px;color:var(--soft)}
.mbar{display:none}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px;max-width:760px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

label.f textarea{min-height:70px;resize:vertical}
.err{color:var(--warn);font-size:13px;font-weight:700}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:28px clamp(16px,4vw,36px);max-width:760px;display:grid;gap:18px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(0,0,0,.35)}

.doc .dh h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0;color:var(--forest)}
.doc .meta{text-align:right;font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums}
.doc .meta b{color:var(--ink);font-size:15px}
.cli{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;font-size:14px}
.cli dt{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.cli dd{margin:0 0 6px;overflow-wrap:anywhere}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);text-align:left;border-bottom:1px solid var(--line);padding:6px 4px}
td{padding:7px 4px;border-bottom:1px dotted var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tfoot td{border:0;font-weight:700}

.cond{font-size:12.5px;color:var(--soft);margin:0;padding-left:18px;display:grid;gap:3px}
.acts{display:flex;flex-wrap:wrap;gap:10px;max-width:760px}
.acts .btn{width:auto;flex:1 1 220px;text-align:center;text-decoration:none}
.aviso{border-left:4px solid var(--forest);background:var(--bg);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.45;margin:0}

.next{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;max-width:760px}
.ns{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.ns .btn{width:auto;text-decoration:none;text-align:center}
.ns p{margin:2px 0 0}
.nn{width:34px;height:34px;border-radius:50%;background:var(--forest);color:var(--on-forest);display:grid;place-items:center;font-weight:800}

.callout{background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-size:13.5px;max-width:760px}

  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px;align-items:center;justify-content:space-between}
  .mbar .btn{width:auto}
  .mbar b{font-size:18px;color:var(--forest);font-variant-numeric:tabular-nums}
  .f2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function lines(){ return Object.entries(S.cart).filter(([,q])=>q>0).map(([id,q])=>({...byId[id],q})).filter(x=>x.n); }
function totals(){
  const L = lines(); let eur = 0, usd = 0, pend = 0;

  return {L, eur, usd, pend, emb, total: usd+emb, count: L.reduce((a,x)=>a+x.q,0)};
}
function setQty(id,q){ q = Math.max(0,Math.min(99,Math.round(Number(q)||0))); if (q) S.cart[id]=q; else delete S.cart[id]; save(); }

  if (b.dataset.cat){ S.cat = b.dataset.cat; document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.cat===S.cat)); drawCats(); return; }
  if (b.dataset.i){ setQty(b.dataset.i,(S.cart[b.dataset.i]||0)+1); refreshRow(b.dataset.i); return; }
  if (b.dataset.d){ setQty(b.dataset.d,(S.cart[b.dataset.d]||0)-1); refreshRow(b.dataset.d); return; }
  if (b.dataset.rm){ setQty(b.dataset.rm,0); refreshRow(b.dataset.rm); return; }
  if (b.hasAttribute("data-next") || b.id==="mnext"){ if (totals().L.length){ S.step=2; render(); window.scrollTo(0,0); } return; }
  if (b.hasAttribute("data-back") || b.hasAttribute("data-edit")){ S.step=1; render(); return; }
  if (b.hasAttribute("data-new")){ S.cart={}; save(); S.step=1; render(); toast("Lista vacía, lista para otra cotización"); return; }
  if (b.hasAttribute("data-copy")){ const txt = quoteText();
    navigator.clipboard.writeText(txt).then(()=>toast("Cotización copiada")).catch(()=>{ const c=$("#copybox"); c.focus(); c.select(); toast("Texto seleccionado: cópialo"); }); }
});
document.addEventListener("change", e=>{ const id = e.target.dataset?.q; if (id){ setQty(id,e.target.value); refreshRow(id); } });
render();
</script>

</body></html>
